version: 2
updates:
  # SwiftPM dependencies (Sparkle, Textual) declared in Package.swift.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    groups:
      swift:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # GitHub Actions used by the release + CI workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
