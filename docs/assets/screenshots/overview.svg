<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Orbita main window: a left project sidebar, an agent tab strip (Agents, Codex, Claude Code, Trae), a summary stat row, capability cards with status badges and per-agent load indicators, and a right inspector panel showing where a capability comes from and which agents load it.">
  <style>
    .canvas{fill:#0f1116}
    .sidebar{fill:#16181d}
    .card{fill:#1e2025}
    .elevated{fill:#26282e}
    .chip{fill:#23252b}
    .tprim{fill:#eceef1}
    .tsec{fill:#9aa1ab}
    .tmono{fill:#c9d1d9}
    .bord{stroke:#ffffff;stroke-opacity:.10;fill:none}
    .seBord{stroke:#ffffff;stroke-opacity:.16;fill:none}
    .accentfill{fill:#e9eaec}
    .accenttext{fill:#0f1116}
    .selrow{fill:#ffffff;fill-opacity:.06}
    @media (prefers-color-scheme: light){
      .canvas{fill:#f1f1f3}
      .sidebar{fill:#e9e9eb}
      .card{fill:#ffffff}
      .elevated{fill:#ffffff}
      .chip{fill:#ededee}
      .tprim{fill:#1b1c20}
      .tsec{fill:#5f636b}
      .tmono{fill:#2b2f36}
      .bord{stroke:#000000;stroke-opacity:.10}
      .seBord{stroke:#000000;stroke-opacity:.16}
      .accentfill{fill:#1b1c20}
      .accenttext{fill:#ffffff}
      .selrow{fill:#000000;fill-opacity:.05}
    }
  </style>
  <defs>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- window -->
  <g filter="url(#winShadow)">
    <rect x="10" y="8" width="980" height="584" rx="14" class="canvas"/>
  </g>
  <rect x="10.5" y="8.5" width="979" height="583" rx="13.5" class="bord"/>

  <!-- title bar -->
  <circle cx="34" cy="30" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="30" r="6" fill="#febc2e"/>
  <circle cx="74" cy="30" r="6" fill="#28c840"/>
  <text x="500" y="34" text-anchor="middle" font-size="12.5" class="tsec">my-app — Orbita</text>
  <line x1="10" y1="52" x2="990" y2="52" class="bord"/>

  <!-- ===================== SIDEBAR ===================== -->
  <rect x="10" y="52" width="186" height="540" class="sidebar"/>
  <line x1="196" y1="52" x2="196" y2="592" class="bord"/>
  <!-- brand -->
  <circle cx="36" cy="82" r="9" fill="none" stroke="#7aa2ff" stroke-width="2"/>
  <circle cx="36" cy="82" r="3" fill="#7aa2ff"/>
  <text x="54" y="87" font-size="15" font-weight="700" class="tprim">Orbita</text>
  <!-- recent -->
  <text x="28" y="124" font-size="10.5" letter-spacing="1.2" class="tsec">RECENT PROJECTS</text>
  <rect x="20" y="134" width="166" height="32" rx="8" class="selrow"/>
  <rect x="20.5" y="134.5" width="165" height="31" rx="7.5" class="seBord"/>
  <rect x="32" y="146" width="9" height="9" rx="2" class="tprim" fill-opacity="0.85"/>
  <text x="50" y="155" font-size="13" font-weight="600" class="tprim">my-app</text>
  <rect x="32" y="182" width="9" height="9" rx="2" class="tsec"/>
  <text x="50" y="191" font-size="13" class="tsec">api-gateway</text>
  <rect x="32" y="214" width="9" height="9" rx="2" class="tsec"/>
  <text x="50" y="223" font-size="13" class="tsec">infra-tools</text>
  <!-- this mac -->
  <line x1="20" y1="544" x2="186" y2="544" class="bord"/>
  <circle cx="37" cy="566" r="6" class="tsec"/>
  <text x="52" y="570" font-size="12.5" class="tsec">This Mac</text>

  <!-- ===================== MAIN ===================== -->
  <!-- agent tab strip -->
  <g font-size="12.5">
    <!-- Agents (selected) -->
    <rect x="212" y="70" width="92" height="30" rx="8" class="accentfill"/>
    <circle cx="228" cy="85" r="4.5" fill="#7aa2ff"/>
    <text x="240" y="89" font-weight="600" class="accenttext">Agents</text>
    <!-- Codex -->
    <rect x="312" y="70" width="80" height="30" rx="8" class="chip"/>
    <rect x="312.5" y="70.5" width="79" height="29" rx="7.5" class="bord"/>
    <circle cx="328" cy="85" r="4.5" fill="#10a37f"/>
    <text x="340" y="89" class="tprim">Codex</text>
    <!-- Claude Code -->
    <rect x="400" y="70" width="118" height="30" rx="8" class="chip"/>
    <rect x="400.5" y="70.5" width="117" height="29" rx="7.5" class="bord"/>
    <circle cx="416" cy="85" r="4.5" fill="#d97757"/>
    <text x="428" y="89" class="tprim">Claude Code</text>
    <!-- Trae -->
    <rect x="526" y="70" width="68" height="30" rx="8" class="chip"/>
    <rect x="526.5" y="70.5" width="67" height="29" rx="7.5" class="bord"/>
    <circle cx="542" cy="85" r="4.5" fill="#e5484d"/>
    <text x="554" y="89" class="tprim">Trae</text>
    <!-- Trae CN (reuses Trae's icon) -->
    <rect x="602" y="70" width="86" height="30" rx="8" class="chip"/>
    <rect x="602.5" y="70.5" width="85" height="29" rx="7.5" class="bord"/>
    <circle cx="618" cy="85" r="4.5" fill="#e5484d"/>
    <text x="630" y="89" class="tprim">Trae CN</text>
  </g>

  <!-- summary stat chips -->
  <g font-size="12">
    <rect x="212" y="120" width="96" height="28" rx="14" class="chip"/>
    <circle cx="230" cy="134" r="4" fill="#2ea043"/>
    <text x="242" y="138" class="tprim">46 loaded</text>
    <rect x="316" y="120" width="86" height="28" rx="14" class="chip"/>
    <circle cx="334" cy="134" r="4" fill="#d29922"/>
    <text x="346" y="138" class="tprim">3 drifted</text>
    <rect x="410" y="120" width="92" height="28" rx="14" class="chip"/>
    <circle cx="428" cy="134" r="4" fill="#6e7681"/>
    <text x="440" y="138" class="tprim">2 disabled</text>
    <rect x="510" y="120" width="94" height="28" rx="14" class="chip"/>
    <circle cx="528" cy="134" r="4" fill="#a371f7"/>
    <text x="540" y="138" class="tprim">1 conflict</text>
  </g>

  <!-- category chips -->
  <g font-size="11.5">
    <rect x="212" y="162" width="44" height="26" rx="13" class="accentfill"/>
    <text x="234" y="179" text-anchor="middle" font-weight="600" class="accenttext">All</text>
    <text x="276" y="179" class="tsec">Skills</text>
    <text x="324" y="179" class="tsec">Plugins</text>
    <text x="384" y="179" class="tsec">Commands</text>
    <text x="462" y="179" class="tsec">MCP</text>
    <text x="502" y="179" class="tsec">Hooks</text>
  </g>

  <!-- capability cards -->
  <!-- card template: x=212 width=496 -->
  <g font-size="13">
    <!-- card 1: drifted -->
    <rect x="212" y="204" width="496" height="66" rx="11" class="card"/>
    <rect x="212.5" y="204.5" width="495" height="65" rx="10.5" class="bord"/>
    <rect x="228" y="222" width="30" height="30" rx="8" class="elevated"/>
    <text x="243" y="242" text-anchor="middle" font-size="14">📄</text>
    <text x="272" y="232" font-weight="600" class="tprim">code-review</text>
    <text x="272" y="252" font-size="11.5" class="tsec">Skill · .agents/skills</text>
    <!-- badge drifted -->
    <rect x="470" y="224" width="62" height="22" rx="11" fill="#d29922" fill-opacity="0.18"/>
    <text x="501" y="239" text-anchor="middle" font-size="11" font-weight="600" fill="#e3a92b">Drifted</text>
    <!-- load dots -->
    <text x="556" y="240" font-size="10.5" class="tsec">loads</text>
    <circle cx="600" cy="236" r="6" fill="#10a37f"/>
    <circle cx="620" cy="236" r="6" fill="#d97757"/>
    <circle cx="640" cy="236" r="6" fill="#6e7681" fill-opacity="0.5"/>
    <text x="690" y="240" text-anchor="end" font-size="16" class="tsec">›</text>

    <!-- card 2: enabled -->
    <rect x="212" y="278" width="496" height="66" rx="11" class="card"/>
    <rect x="212.5" y="278.5" width="495" height="65" rx="10.5" class="bord"/>
    <rect x="228" y="296" width="30" height="30" rx="8" class="elevated"/>
    <text x="243" y="316" text-anchor="middle" font-size="14">📄</text>
    <text x="272" y="306" font-weight="600" class="tprim">pr-summarizer</text>
    <text x="272" y="326" font-size="11.5" class="tsec">Skill · ~/.agents/skills (My Mac)</text>
    <rect x="466" y="298" width="66" height="22" rx="11" fill="#2ea043" fill-opacity="0.18"/>
    <text x="499" y="313" text-anchor="middle" font-size="11" font-weight="600" fill="#3fb950">Enabled</text>
    <text x="556" y="314" font-size="10.5" class="tsec">loads</text>
    <circle cx="600" cy="310" r="6" fill="#10a37f"/>
    <circle cx="620" cy="310" r="6" fill="#d97757"/>
    <circle cx="640" cy="310" r="6" fill="#e5484d"/>
    <text x="690" y="314" text-anchor="end" font-size="16" class="tsec">›</text>

    <!-- card 3: disabled -->
    <rect x="212" y="352" width="496" height="66" rx="11" class="card"/>
    <rect x="212.5" y="352.5" width="495" height="65" rx="10.5" class="bord"/>
    <rect x="228" y="370" width="30" height="30" rx="8" class="elevated"/>
    <text x="243" y="390" text-anchor="middle" font-size="14">🧩</text>
    <text x="272" y="380" font-weight="600" class="tprim">anthropics/web-fetch</text>
    <text x="272" y="400" font-size="11.5" class="tsec">Plugin · Claude plugin cache</text>
    <rect x="462" y="372" width="70" height="22" rx="11" fill="#6e7681" fill-opacity="0.22"/>
    <text x="497" y="387" text-anchor="middle" font-size="11" font-weight="600" class="tsec">Disabled</text>
    <text x="556" y="388" font-size="10.5" class="tsec">loads</text>
    <circle cx="600" cy="384" r="6" fill="#6e7681" fill-opacity="0.5"/>
    <circle cx="620" cy="384" r="6" fill="#d97757"/>
    <circle cx="640" cy="384" r="6" fill="#6e7681" fill-opacity="0.5"/>
    <text x="690" y="388" text-anchor="end" font-size="16" class="tsec">›</text>

    <!-- card 4: duplicate/conflict -->
    <rect x="212" y="426" width="496" height="66" rx="11" class="card"/>
    <rect x="212.5" y="426.5" width="495" height="65" rx="10.5" class="bord"/>
    <rect x="228" y="444" width="30" height="30" rx="8" class="elevated"/>
    <text x="243" y="464" text-anchor="middle" font-size="14">⌘</text>
    <text x="272" y="454" font-weight="600" class="tprim">deploy</text>
    <text x="272" y="474" font-size="11.5" class="tsec">Command · .codex/commands + .claude/commands</text>
    <rect x="458" y="446" width="74" height="22" rx="11" fill="#a371f7" fill-opacity="0.20"/>
    <text x="495" y="461" text-anchor="middle" font-size="11" font-weight="600" fill="#b083f0">Duplicate</text>
    <text x="556" y="462" font-size="10.5" class="tsec">loads</text>
    <circle cx="600" cy="458" r="6" fill="#10a37f"/>
    <circle cx="620" cy="458" r="6" fill="#d97757"/>
    <circle cx="640" cy="458" r="6" fill="#6e7681" fill-opacity="0.5"/>
    <text x="690" y="462" text-anchor="end" font-size="16" class="tsec">›</text>
  </g>

  <!-- ===================== INSPECTOR ===================== -->
  <rect x="712" y="52" width="278" height="540" class="sidebar"/>
  <line x1="712" y1="52" x2="712" y2="592" class="bord"/>
  <!-- header -->
  <text x="732" y="92" font-size="17" font-weight="700" class="tprim">code-review</text>
  <rect x="732" y="104" width="46" height="22" rx="11" class="chip"/>
  <text x="755" y="119" text-anchor="middle" font-size="11" class="tsec">Skill</text>
  <rect x="784" y="104" width="62" height="22" rx="11" fill="#d29922" fill-opacity="0.18"/>
  <text x="815" y="119" text-anchor="middle" font-size="11" font-weight="600" fill="#e3a92b">Drifted</text>
  <line x1="732" y1="144" x2="970" y2="144" class="bord"/>

  <!-- loaded by -->
  <text x="732" y="170" font-size="10.5" letter-spacing="1.1" class="tsec">LOADED BY</text>
  <circle cx="740" cy="192" r="5.5" fill="#10a37f"/>
  <text x="754" y="196" font-size="12.5" class="tprim">Codex</text>
  <text x="968" y="196" text-anchor="end" font-size="12.5" fill="#3fb950">✓</text>
  <circle cx="740" cy="218" r="5.5" fill="#d97757"/>
  <text x="754" y="222" font-size="12.5" class="tprim">Claude Code</text>
  <text x="968" y="222" text-anchor="end" font-size="12.5" fill="#3fb950">✓</text>
  <circle cx="740" cy="244" r="5.5" fill="#e5484d"/>
  <text x="754" y="248" font-size="12.5" class="tsec">Trae</text>
  <text x="968" y="248" text-anchor="end" font-size="12.5" class="tsec">—</text>
  <line x1="732" y1="270" x2="970" y2="270" class="bord"/>

  <!-- source -->
  <text x="732" y="296" font-size="10.5" letter-spacing="1.1" class="tsec">SOURCE</text>
  <text x="732" y="318" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="tmono">.agents/skills/code-review/</text>
  <text x="732" y="334" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="tmono">SKILL.md</text>

  <!-- risk -->
  <text x="732" y="368" font-size="10.5" letter-spacing="1.1" class="tsec">RISK</text>
  <rect x="732" y="378" width="54" height="22" rx="11" fill="#4493f8" fill-opacity="0.16"/>
  <text x="759" y="393" text-anchor="middle" font-size="11" font-weight="600" fill="#5aa2ff">Read</text>

  <!-- drift note -->
  <rect x="732" y="416" width="238" height="52" rx="9" fill="#d29922" fill-opacity="0.10"/>
  <rect x="732.5" y="416.5" width="237" height="51" rx="8.5" fill="none" stroke="#d29922" stroke-opacity="0.35"/>
  <text x="746" y="438" font-size="11.5" fill="#e3a92b" font-weight="600">⚠ Copy in Codex drifted from source</text>
  <text x="746" y="456" font-size="11" class="tsec">The forked copy no longer matches .agents.</text>

  <!-- actions -->
  <rect x="732" y="488" width="150" height="34" rx="9" class="accentfill"/>
  <text x="807" y="510" text-anchor="middle" font-size="13" font-weight="600" class="accenttext">Re-sync from source</text>
  <rect x="892" y="488" width="78" height="34" rx="9" class="chip"/>
  <rect x="892.5" y="488.5" width="77" height="33" rx="8.5" class="bord"/>
  <text x="931" y="510" text-anchor="middle" font-size="13" class="tprim">Open</text>
</svg>
